<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIEMARIUN — Admin</title>
<style>
:root{--bg:#0b0907;--card:#17130f;--card2:#1d1813;--line:#30271d;--gold:#d4b277;--text:#f6f3ec;--muted:#9d958a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,textarea,select{font:inherit} button{cursor:pointer}
.wrap{max-width:1180px;margin:auto;padding:28px 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px}
.brand{letter-spacing:.18em;font-size:14px}.admin-label{color:var(--muted);font-size:11px;letter-spacing:.16em}
.layout{display:grid;grid-template-columns:300px 1fr;gap:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h2{font-size:13px;letter-spacing:.16em;margin:0 0 16px}
.project-list{display:flex;flex-direction:column;gap:8px}
.project-item{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid transparent;border-radius:12px;background:#120f0c}
.project-item.active{border-color:var(--gold)}
.num{color:var(--gold);font-size:11px;width:24px}.pname{font-size:13px;flex:1}.ptype{font-size:9px;color:var(--muted);letter-spacing:.12em}
.add{width:100%;margin-bottom:14px;padding:13px;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:10px}
.form{display:grid;gap:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:grid;gap:7px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:12px;outline:none}
textarea{min-height:120px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--gold)}
.drop{border:1px dashed #514536;border-radius:12px;padding:18px;text-align:center;color:var(--muted);background:#120f0c}
.drop input{display:none}.drop strong{display:block;color:var(--text);font-size:12px;margin-bottom:5px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.photo{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#0f0d0a;border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:6px;top:6px;border:0;border-radius:50%;width:26px;height:26px;background:#0b0907cc;color:#fff}
.actions{display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:18px}
.btn{border:1px solid var(--line);background:transparent;color:var(--text);padding:11px 17px;border-radius:10px}.primary{border-color:var(--gold);color:var(--gold)}
.empty{color:var(--muted);font-size:12px;line-height:1.6;padding:20px 0}
.notice{margin-bottom:20px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:11px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header><div><div class="brand">MIEMARIUN</div><div class="admin-label">ARCHITECTURAL STUDIO · ADMIN</div></div><button class="btn" onclick="window.location.href='index.html'">VIEW SITE</button></header>
<div class="notice">Prototype only: changes are stored in this browser for now. GitHub publishing will be connected in the next step.</div>
<div class="layout">
<aside class="panel">
<h2>PROJECTS</h2>
<button class="add" onclick="newProject()">+ ADD PROJECT</button>
<div id="projectList" class="project-list"></div>
</aside>
<main class="panel">
<div id="editor"></div>
</main>
</div>
</div>
<script>
const KEY='miemariun_admin_projects_v1';
let projects=JSON.parse(localStorage.getItem(KEY)||'null')||[
{id:1,title:'PRIVATE RESIDENCE',category:'RESIDENTIAL',location:'Tashkent, Uzbekistan',year:'2026',description:'Contemporary residential architecture focused on proportion, material and everyday spatial experience.',cover:'',gallery:[]},
{id:2,title:'OFFICE BUILDING',category:'COMMERCIAL',location:'Tashkent, Uzbekistan',year:'2026',description:'A compact contemporary office concept with a clear structural rhythm and public-facing ground floor.',cover:'',gallery:[]}
];
let selected=0;
function save(){localStorage.setItem(KEY,JSON.stringify(projects));renderList()}
function renderList(){
 const el=document.getElementById('projectList');
 el.innerHTML=projects.map((p,i)=>`<div class="project-item ${i===selected?'active':''}" onclick="selectProject(${i})"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="pname">${esc(p.title||'UNTITLED')}</span><span class="ptype">${esc(p.category||'')}</span></div>`).join('');
}
function selectProject(i){selected=i;renderList();renderEditor()}
function newProject(){projects.push({id:Date.now(),title:'NEW PROJECT',category:'RESIDENTIAL',location:'',year:'2026',description:'',cover:'',gallery:[]});selected=projects.length-1;save();renderEditor()}
function renderEditor(){
 const p=projects[selected]; if(!p){document.getElementById('editor').innerHTML='<div class="empty">No project selected.</div>';return}
 document.getElementById('editor').innerHTML=`
 <div class="form">
 <div class="grid2">
 <label>Title<input id="title" value="${attr(p.title)}"></label>
 <label>Category<select id="category">${['RESIDENTIAL','PUBLIC','COMMERCIAL','MASTERPLAN'].map(x=>`<option ${x===p.category?'selected':''}>${x}</option>`).join('')}</select></label>
 </div>
 <div class="grid2">
 <label>Location<input id="location" value="${attr(p.location)}"></label>
 <label>Year<input id="year" value="${attr(p.year)}"></label>
 </div>
 <label>Description<textarea id="description">${esc(p.description)}</textarea></label>
 <label>Cover image
 <div class="drop"><strong>UPLOAD COVER</strong><span>Choose one image</span><input id="coverInput" type="file" accept="image/*" onchange="loadCover(event)"></div>
 </label>
 <div class="photos">${p.cover?photo(p.cover,'cover'):''}</div>
 <label>Gallery
 <div class="drop"><strong>ADD PHOTOS</strong><span>Choose multiple images</span><input id="galleryInput" type="file" accept="image/*" multiple onchange="loadGallery(event)"></div>
 </label>
 <div class="photos">${p.gallery.map((x,i)=>photo(x,'gallery',i)).join('')}</div>
 <div class="actions"><button class="btn" onclick="deleteProject()">DELETE PROJECT</button><button class="btn primary" onclick="saveProject()">SAVE PROJECT</button></div>
 </div>`;
}
function photo(src,type,i){return `<div class="photo"><img src="${src}"><button onclick="${type==='cover'?'removeCover()':`removeGallery(${i})`}">×</button></div>`}
function saveProject(){
 const p=projects[selected];p.title=document.getElementById('title').value;p.category=document.getElementById('category').value;p.location=document.getElementById('location').value;p.year=document.getElementById('year').value;p.description=document.getElementById('description').value;save();renderEditor();
}
function deleteProject(){if(!confirm('Delete this project?'))return;projects.splice(selected,1);selected=Math.max(0,selected-1);save();renderEditor()}
function loadCover(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{projects[selected].cover=r.result;renderEditor()};r.readAsDataURL(f)}
function loadGallery(e){[...e.target.files].forEach(f=>{const r=new FileReader();r.onload=()=>{projects[selected].gallery.push(r.result);renderEditor()};r.readAsDataURL(f)})}
function removeCover(){projects[selected].cover='';renderEditor()}
function removeGallery(i){projects[selected].gallery.splice(i,1);renderEditor()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(s=''){return esc(s)}
renderList();renderEditor();
</script>
</body>
</html>
